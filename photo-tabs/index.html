<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото-вкладки</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#202124}header{padding:22px;text-align:center;font-size:28px;font-weight:700}.wrap{max-width:720px;margin:auto;padding:16px}button{border:0;border-radius:16px;padding:14px 18px;font-size:17px;cursor:pointer;background:#222;color:#fff}.plus{width:58px;height:58px;border-radius:50%;font-size:30px;display:block;margin:0 auto 22px}.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.tab{background:#fff;border-radius:18px;padding:20px;min-height:100px;box-shadow:0 3px 14px #0001;font-size:18px;font-weight:600;cursor:pointer}.back{background:#ddd;color:#222;margin-bottom:14px}.add{margin-bottom:18px}.delete{background:#c62828;margin-left:8px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery .photoWrap{position:relative}.gallery img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#ddd;display:block}.photoDel{position:absolute;right:7px;top:7px;width:34px;height:34px;padding:0;border-radius:50%;background:#c62828;font-size:18px}.empty{text-align:center;color:#777;padding:40px 10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.box{background:#fff;border-radius:20px;padding:22px;width:min(420px,100%)}input[type=text]{display:block;width:100%;padding:13px;border:1px solid #bbb;border-radius:12px;font-size:17px;margin:12px 0;color:#202124;background:#fff}.actions{display:flex;gap:10px;justify-content:flex-end}.cancel{background:#ddd;color:#222}
</style>
</head>
<body>
<header>Фото-вкладки</header><main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="box"><h2>Название вкладки</h2><input id="name" type="text" placeholder="Например: Попугаи" autocomplete="off"><div class="actions"><button class="cancel" id="cancelBtn" type="button">Отмена</button><button id="okBtn" type="button">OK</button></div></div></div>
<input id="picker" type="file" accept="image/*" multiple hidden>
<script>
(function(){
var KEY='photoTabs_v1',app=document.getElementById('app'),modal=document.getElementById('modal'),nameInput=document.getElementById('name'),picker=document.getElementById('picker'),tabs=[],current=-1;
try{tabs=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(tabs))tabs=[];}catch(e){tabs=[];}
function save(){localStorage.setItem(KEY,JSON.stringify(tabs));}
function openModal(){modal.style.display='flex';nameInput.value='';setTimeout(function(){nameInput.focus();},50);}
function closeModal(){modal.style.display='none';}
function createTab(){var n=nameInput.value.trim();if(!n){nameInput.focus();return;}tabs.push(n);save();closeModal();renderHome();}
function renderHome(){current=-1;app.innerHTML='';var plus=document.createElement('button');plus.className='plus';plus.type='button';plus.textContent='＋';plus.onclick=openModal;app.appendChild(plus);var box=document.createElement('div');box.className='tabs';if(!tabs.length){var e=document.createElement('div');e.className='empty';e.textContent='Нажми ＋ и создай первую вкладку.';box.appendChild(e);}else{tabs.forEach(function(t,i){var item=document.createElement('div');item.className='tab';item.textContent=t;item.onclick=function(){openTab(i);};box.appendChild(item);});}app.appendChild(box);}
function openTab(i){current=i;renderTab();}
function deleteTab(){if(current<0)return;if(!confirm('Удалить вкладку «'+tabs[current]+'»?'))return;localStorage.removeItem('imgs_'+current);tabs.splice(current,1);for(var i=current;i<tabs.length;i++){var next=localStorage.getItem('imgs_'+(i+1));if(next!==null)localStorage.setItem('imgs_'+i,next);else localStorage.removeItem('imgs_'+i);}localStorage.removeItem('imgs_'+tabs.length);save();renderHome();}
function renderTab(){app.innerHTML='';var back=document.createElement('button');back.className='back';back.type='button';back.textContent='← Назад';back.onclick=renderHome;app.appendChild(back);var title=document.createElement('h2');title.textContent=tabs[current]||'';app.appendChild(title);var add=document.createElement('button');add.className='add';add.type='button';add.textContent='🖼️ Добавить фото';add.onclick=function(){picker.value='';picker.click();};app.appendChild(add);var del=document.createElement('button');del.className='delete';del.type='button';del.textContent='Удалить';del.onclick=deleteTab;app.appendChild(del);var gallery=document.createElement('div');gallery.className='gallery';var imgs=getImages();imgs.forEach(function(src,index){var wrap=document.createElement('div');wrap.className='photoWrap';var img=document.createElement('img');img.src=src;var remove=document.createElement('button');remove.className='photoDel';remove.type='button';remove.textContent='×';remove.title='Удалить фото';remove.onclick=function(){deletePhoto(index);};wrap.appendChild(img);wrap.appendChild(remove);gallery.appendChild(wrap);});app.appendChild(gallery);if(!imgs.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Фото пока нет.';app.appendChild(empty);}}
function deletePhoto(index){var arr=getImages();if(index<0||index>=arr.length)return;if(!confirm('Удалить это фото?'))return;arr.splice(index,1);localStorage.setItem('imgs_'+current,JSON.stringify(arr));renderTab();}\nfunction getImages(){try{var a=JSON.parse(localStorage.getItem('imgs_'+current)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
document.getElementById('okBtn').onclick=createTab;document.getElementById('cancelBtn').onclick=closeModal;nameInput.onkeydown=function(e){if(e.key==='Enter')createTab();};modal.onclick=function(e){if(e.target===modal)closeModal();};
picker.onchange=function(){var files=Array.prototype.slice.call(picker.files);if(!files.length)return;var key='imgs_'+current;var arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){arr=[];}var slots=8-arr.length;if(slots<=0){alert('В одной вкладке можно хранить максимум 8 фото.');picker.value='';return;}if(files.length>slots){files=files.slice(0,slots);alert('Можно добавить только '+slots+' фото: максимум — 8 в одной вкладке.');}var remaining=files.length;files.forEach(function(file){var reader=new FileReader();reader.onload=function(){arr.push(reader.result);remaining--;if(remaining===0){try{localStorage.setItem(key,JSON.stringify(arr));renderTab();}catch(e){alert('Не удалось сохранить фото. Возможно, в памяти браузера закончилось место.');}}};reader.readAsDataURL(file);});};
renderHome();
})();
</script>
</body></html>
