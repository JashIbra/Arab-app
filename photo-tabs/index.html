<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото-вкладки</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#202124}
header{padding:22px;text-align:center;font-size:28px;font-weight:700}.wrap{max-width:720px;margin:auto;padding:16px}
button{border:0;border-radius:16px;padding:14px 18px;font-size:17px;cursor:pointer;background:#222;color:#fff}
.plus{width:58px;height:58px;border-radius:50%;font-size:30px;display:block;margin:0 auto 22px}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tab{background:#fff;border-radius:18px;padding:20px;min-height:100px;box-shadow:0 3px 14px #0001;font-size:18px;font-weight:600;cursor:pointer}
.back{background:#ddd;color:#222;margin-bottom:14px}.add{margin-bottom:18px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#ddd}
.empty{text-align:center;color:#777;padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.box{background:#fff;border-radius:20px;padding:22px;width:min(420px,100%)}
input[type=text]{display:block;width:100%;padding:13px;border:1px solid #bbb;border-radius:12px;font-size:17px;margin:12px 0;color:#202124;background:#fff}
.actions{display:flex;gap:10px;justify-content:flex-end}.cancel{background:#ddd;color:#222}
</style>
</head>
<body>
<header>Фото-вкладки</header>
<main class="wrap" id="app"></main>

<div class="modal" id="modal">
  <div class="box">
    <h2>Название вкладки</h2>
    <input id="name" type="text" placeholder="Например: Попугаи" autocomplete="off">
    <div class="actions">
      <button class="cancel" id="cancelBtn" type="button">Отмена</button>
      <button id="okBtn" type="button">OK</button>
    </div>
  </div>
</div>
<input id="picker" type="file" accept="image/*" multiple hidden>

<script>
(function(){
  var KEY = 'photoTabs_v1';
  var app = document.getElementById('app');
  var modal = document.getElementById('modal');
  var nameInput = document.getElementById('name');
  var okBtn = document.getElementById('okBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var picker = document.getElementById('picker');
  var tabs = [];
  var current = -1;

  try {
    var saved = localStorage.getItem(KEY);
    tabs = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(tabs)) tabs = [];
  } catch(e) { tabs = []; }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(tabs)); } catch(e) {}
  }

  function openModal(){
    modal.style.display = 'flex';
    nameInput.value = '';
    setTimeout(function(){ nameInput.focus(); }, 50);
  }

  function closeModal(){
    modal.style.display = 'none';
  }

  function createTab(){
    var n = nameInput.value.trim();
    if (!n) { nameInput.focus(); return; }
    tabs.push(n);
    save();
    closeModal();
    renderHome();
  }

  function renderHome(){
    current = -1;
    app.innerHTML = '';
    
    var plus = document.createElement('button');
    plus.className = 'plus';
    plus.type = 'button';
    plus.textContent = '＋';
    plus.addEventListener('click', openModal);
    app.appendChild(plus);

    var tabsBox = document.createElement('div');
    tabsBox.className = 'tabs';

    if (!tabs.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Нажми ＋ и создай первую вкладку.';
      tabsBox.appendChild(empty);
    } else {
      tabs.forEach(function(t, i){
        var item = document.createElement('div');
        item.className = 'tab';
        item.textContent = t;
        item.addEventListener('click', function(){ openTab(i); });
        tabsBox.appendChild(item);
      });
    }
    app.appendChild(tabsBox);
  }

  function openTab(i){
    current = i;
    renderTab();
  }

  function renderTab(){
    app.innerHTML = '';

    var back = document.createElement('button');
    back.className = 'back';
    back.type = 'button';
    back.textContent = '← Назад';
    back.addEventListener('click', renderHome);
    app.appendChild(back);

    var title = document.createElement('h2');
    title.textContent = tabs[current] || '';
    app.appendChild(title);

    var add = document.createElement('button');
    add.className = 'add';
    add.type = 'button';
    add.textContent = '🖼️ Добавить фото';
    add.addEventListener('click', function(){ picker.click(); });
    app.appendChild(add);

    var gallery = document.createElement('div');
    gallery.className = 'gallery';

    var imgs = [];
    try { imgs = JSON.parse(localStorage.getItem('imgs_' + current) || '[]'); } catch(e) {}

    imgs.forEach(function(src){
      var img = document.createElement('img');
      img.src = src;
      gallery.appendChild(img);
    });

    app.appendChild(gallery);

    if (!imgs.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Фото пока нет.';
      app.appendChild(empty);
    }
  }

  okBtn.addEventListener('click', createTab);
  cancelBtn.addEventListener('click', closeModal);
  nameInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') createTab();
  });
  modal.addEventListener('click', function(e){
    if (e.target === modal) closeModal();
  });

  picker.addEventListener('change', function(){
    var files = Array.prototype.slice.call(picker.files);
    files.forEach(function(file){
      var reader = new FileReader();
      reader.onload = function(){
        var key = 'imgs_' + current;
        var arr = [];
        try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
        arr.push(reader.result);
        localStorage.setItem(key, JSON.stringify(arr));
        renderTab();
      };
      reader.readAsDataURL(file);
    });
    picker.value = '';
  });

  renderHome();
})();
</script>
</body>
</html>
