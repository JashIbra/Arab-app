<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото-вкладки</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#202124}
header{padding:22px;text-align:center;font-size:28px;font-weight:700}.wrap{max-width:720px;margin:auto;padding:16px}
button{border:0;border-radius:16px;padding:14px 18px;font-size:17px;cursor:pointer;background:#222;color:#fff}
.plus{width:58px;height:58px;border-radius:50%;font-size:30px;display:block;margin:0 auto 22px}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tab{background:#fff;border-radius:18px;padding:20px;min-height:100px;box-shadow:0 3px 14px #0001;font-size:18px;font-weight:600;cursor:pointer}
.back{background:#ddd;color:#222;margin-bottom:14px}.add{margin-bottom:18px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#ddd}
.empty{text-align:center;color:#777;padding:40px 10px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.box{background:white;border-radius:20px;padding:22px;width:min(420px,100%)}input[type=text]{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:17px;margin:12px 0;color:#202124;background:#fff}.actions{display:flex;gap:10px;justify-content:flex-end}.cancel{background:#ddd;color:#222}
</style></head><body>
<header>Фото-вкладки</header><main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="box"><h2>Название вкладки</h2><input id="name" type="text" placeholder="Например: Попугаи"><div class="actions"><button type="button" class="cancel" id="cancelBtn">Отмена</button><button type="button" id="okBtn">OK</button></div></div></div>
<input id="picker" type="file" accept="image/*" multiple hidden>
<script>
const KEY='photoTabs_v1';
const app=document.getElementById('app'), modalEl=document.getElementById('modal'), nameEl=document.getElementById('name'), pickerEl=document.getElementById('picker'), okBtn=document.getElementById('okBtn'), cancelBtn=document.getElementById('cancelBtn');
let tabs=JSON.parse(localStorage.getItem(KEY)||'[]'), current=null;
function save(){localStorage.setItem(KEY,JSON.stringify(tabs))}
function renderHome(){current=null;app.innerHTML='<button class="plus" id="plusBtn" type="button">＋</button><div class="tabs">'+(tabs.length?tabs.map((t,i)=>'<div class="tab" data-i="'+i+'">'+esc(t)+'</div>').join(''):'<div class="empty">Нажми ＋ и создай первую вкладку.</div>')+'</div>';document.getElementById('plusBtn').onclick=openModal;document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>openTab(Number(el.dataset.i)))}
function openTab(i){current=i;renderTab()}
function renderTab(){const n=tabs[current],imgs=JSON.parse(localStorage.getItem('imgs_'+current)||'[]');app.innerHTML='<button class="back" id="backBtn" type="button">← Назад</button><h2>'+esc(n)+'</h2><button class="add" id="addBtn" type="button">🖼️ Добавить фото</button><div class="gallery">'+imgs.map(x=>'<img src="'+x+'">').join('')+'</div>'+(imgs.length?'':'<div class="empty">Фото пока нет.</div>');document.getElementById('backBtn').onclick=renderHome;document.getElementById('addBtn').onclick=()=>pickerEl.click()}
pickerEl.onchange=()=>{[...pickerEl.files].forEach(file=>{const r=new FileReader();r.onload=()=>{const k='imgs_'+current,a=JSON.parse(localStorage.getItem(k)||'[]');a.push(r.result);localStorage.setItem(k,JSON.stringify(a));renderTab()};r.readAsDataURL(file)});pickerEl.value=''}
function openModal(){modalEl.style.display='flex';nameEl.value='';setTimeout(()=>nameEl.focus(),0)}
function closeModal(){modalEl.style.display='none'}
function createTab(){const n=nameEl.value.trim();if(!n){nameEl.focus();return}tabs.push(n);save();closeModal();renderHome()}
okBtn.onclick=createTab;cancelBtn.onclick=closeModal;
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();createTab()}});
modalEl.addEventListener('click',e=>{if(e.target===modalEl)closeModal()});
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderHome();
</script></body></html>
