<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Shell</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#202124}header{position:relative;padding:22px 16px;min-height:76px;font-size:28px;font-weight:700}.appTitle{display:block;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wrap{max-width:690px;margin:auto;padding:16px}.frameControls{position:absolute;right:16px;top:14px;z-index:10000;display:flex;align-items:center}.frameBtn{position:relative;background:#222;color:#fff;border-radius:12px;padding:9px 13px;font-size:15px}.bgBtn{margin-left:6px}.bgMenu{position:absolute;right:0;top:50px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 24px #0002;display:none;z-index:10001;gap:8px;grid-template-columns:repeat(3,44px);width:164px}.bgChoice{width:44px;height:44px;padding:0;border-radius:12px;border:3px solid #ddd}.bgRemove{grid-column:1 / -1;width:140px;justify-self:center;padding:9px 6px;font-size:13px;background:#ddd;color:#222;white-space:nowrap}.bgChoice.mint{background:#b8eadc}.bgChoice.ruby{background:#c83f5b}.bgChoice.orange{background:#ffb15c}.page-bg-mint{background:#b8eadc}.page-bg-ruby{background:#c83f5b}.page-bg-orange{background:#ffb15c}.frameMenu{position:absolute;right:16px;top:60px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 24px #0002;display:none;z-index:20;gap:8px;grid-template-columns:repeat(2,1fr)}.frameChoice{width:44px;height:44px;padding:0;border-radius:12px;border:3px solid #ddd}.frameRemove{grid-column:1 / -1;width:140px;justify-self:center;padding:9px 6px;font-size:13px;background:#ddd;color:#222;white-space:nowrap}.frameChoice.blue{background:#b9e8ff}.frameChoice.pink{background:#ffc4df}.frameChoice.yellow{background:#ffe79a}.frameChoice.purple{background:#d8c4ff}.tab.frame-blue{border:5px solid #8bd5ff}.tab.frame-pink{border:5px solid #ff9ecb}.tab.frame-yellow{border:5px solid #ffd45c}.tab.frame-purple{border:5px solid #b99aff}button{border:0;border-radius:16px;padding:14px 18px;font-size:17px;cursor:pointer;background:#222;color:#fff}.plus{width:52px;height:52px;border-radius:50%;font-size:27px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;margin:0 auto 22px}.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.tab{background:#fff;border-radius:18px;padding:19px;min-height:96px;box-shadow:0 3px 14px #0001;font-size:18px;font-weight:600;cursor:pointer}.back{background:#ddd;color:#222;margin-bottom:14px}.add{margin-bottom:18px}.delete{background:#c62828;margin-left:8px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery .photoWrap{position:relative}.gallery img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#ddd;display:block}.photoDel{position:absolute;right:7px;top:7px;width:34px;height:34px;padding:0;border-radius:50%;background:#c62828;font-size:18px}.empty{text-align:center;color:#777;padding:40px 10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.box{background:#fff;border-radius:20px;padding:22px;width:min(420px,100%)}input[type=text]{display:block;width:100%;padding:13px;border:1px solid #bbb;border-radius:12px;font-size:17px;margin:12px 0;color:#202124;background:#fff}.actions{display:flex;gap:10px;justify-content:flex-end}.cancel{background:#ddd;color:#222}
@media(max-width:600px){header{min-height:68px;padding:18px 10px}.appTitle{width:100%;font-size:24px;padding-right:175px}.frameControls{right:10px;top:10px}.frameBtn{padding:8px 10px;font-size:13px}.bgBtn{margin-left:4px}}
</style>
</head>
<body>
<header><span class="appTitle">Photo Shell</span>
  <div class="frameControls">
    <button class="frameBtn" id="frameBtn" type="button">РАМКА</button>
    <button class="frameBtn bgBtn" id="bgBtn" type="button">ФОН</button>
    <div class="frameMenu" id="frameMenu">
      <button class="frameChoice blue" data-frame="blue" type="button" title="Голубая"></button>
      <button class="frameChoice pink" data-frame="pink" type="button" title="Розовая"></button>
      <button class="frameChoice yellow" data-frame="yellow" type="button" title="Жёлтая"></button>
      <button class="frameChoice purple" data-frame="purple" type="button" title="Фиолетовая"></button>
      <button class="frameRemove" id="frameRemove" type="button">УБРАТЬ РАМКУ</button>
    </div>
    <div class="bgMenu" id="bgMenu">
      <button class="bgChoice mint" data-bg="mint" type="button" title="Мятный"></button>
      <button class="bgChoice ruby" data-bg="ruby" type="button" title="Рубиновый"></button>
      <button class="bgChoice orange" data-bg="orange" type="button" title="Оранжевый"></button><button class="bgRemove" id="bgRemove" type="button">УБРАТЬ ФОН</button>
    </div>
  </div>
</header><main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="box"><h2>Название вкладки</h2><input id="name" type="text" placeholder="Например: Попугаи" autocomplete="off"><div class="actions"><button class="cancel" id="cancelBtn" type="button">Отмена</button><button id="okBtn" type="button">OK</button></div></div></div>
<input id="picker" type="file" accept="image/*" multiple hidden>
<script>
(function(){
var KEY='photoTabs_v1';
var app=document.getElementById('app');
var modal=document.getElementById('modal');
var nameInput=document.getElementById('name');
var picker=document.getElementById('picker');
var tabs=[];
var current=-1;
var frameKey='photoTabs_frame_v1';
var selectedFrame=localStorage.getItem(frameKey)||'';
var bgKey='photoTabs_bg_v1';
var selectedBg=localStorage.getItem(bgKey)||'';

function applyBackground(){
  document.body.classList.remove('page-bg-mint','page-bg-ruby','page-bg-orange');
  if(selectedBg) document.body.classList.add('page-bg-'+selectedBg);
}
function loadTabs(){
  try{
    var data=JSON.parse(localStorage.getItem(KEY)||'[]');
    tabs=Array.isArray(data)?data:[];
  }catch(e){tabs=[];}
}
function saveTabs(){localStorage.setItem(KEY,JSON.stringify(tabs));}
function getImages(){
  if(current<0)return [];
  try{
    var data=JSON.parse(localStorage.getItem('imgs_'+current)||'[]');
    return Array.isArray(data)?data:[];
  }catch(e){return [];}
}
function openModal(){
  modal.style.display='flex';
  nameInput.value='';
  setTimeout(function(){nameInput.focus();},50);
}
function closeModal(){modal.style.display='none';}
function createTab(){
  var n=nameInput.value.trim();
  if(!n){nameInput.focus();return;}
  if(tabs.length>=4){alert('Можно создать максимум 4 вкладки.');return;}
  tabs.push(n);saveTabs();closeModal();renderHome();
}
function renderHome(){
  current=-1;app.innerHTML='';
  var plus=document.createElement('button');plus.className='plus';plus.type='button';plus.textContent='＋';plus.onclick=openModal;app.appendChild(plus);
  var box=document.createElement('div');box.className='tabs';
  if(tabs.length===0){
    var empty=document.createElement('div');empty.className='empty';empty.textContent='Нажми ＋ и создай первую вкладку.';box.appendChild(empty);
  }else{
    tabs.forEach(function(t,i){
      var item=document.createElement('div');item.className='tab'+(selectedFrame?' frame-'+selectedFrame:'');item.textContent=t;item.onclick=function(){openTab(i);};box.appendChild(item);
    });
  }
  app.appendChild(box);
}
function openTab(i){current=i;renderTab();}
function deleteTab(){
  if(current<0)return;
  if(!confirm('Удалить вкладку «'+tabs[current]+'»?'))return;
  localStorage.removeItem('imgs_'+current);tabs.splice(current,1);
  for(var i=current;i<tabs.length;i++){
    var next=localStorage.getItem('imgs_'+(i+1));
    if(next!==null)localStorage.setItem('imgs_'+i,next);else localStorage.removeItem('imgs_'+i);
  }
  localStorage.removeItem('imgs_'+tabs.length);saveTabs();renderHome();
}
function deletePhoto(index){
  var arr=getImages();if(index<0||index>=arr.length)return;
  if(!confirm('Удалить это фото?'))return;
  arr.splice(index,1);
  try{localStorage.setItem('imgs_'+current,JSON.stringify(arr));renderTab();}catch(e){alert('Не удалось удалить фото.');}
}
function renderTab(){
  app.innerHTML='';
  var back=document.createElement('button');back.className='back';back.type='button';back.textContent='← Назад';back.onclick=renderHome;app.appendChild(back);
  var title=document.createElement('h2');title.textContent=tabs[current]||'';app.appendChild(title);
  var add=document.createElement('button');add.className='add';add.type='button';add.textContent='🖼️ Добавить фото';add.onclick=function(){picker.value='';picker.click();};app.appendChild(add);
  var del=document.createElement('button');del.className='delete';del.type='button';del.textContent='Удалить';del.onclick=deleteTab;app.appendChild(del);
  var gallery=document.createElement('div');gallery.className='gallery';var imgs=getImages();
  imgs.forEach(function(src,index){
    var wrap=document.createElement('div');wrap.className='photoWrap';var img=document.createElement('img');img.src=src;
    var remove=document.createElement('button');remove.className='photoDel';remove.type='button';remove.textContent='×';remove.title='Удалить фото';remove.onclick=function(e){e.stopPropagation();deletePhoto(index);};
    wrap.appendChild(img);wrap.appendChild(remove);gallery.appendChild(wrap);
  });
  app.appendChild(gallery);
  if(imgs.length===0){var empty=document.createElement('div');empty.className='empty';empty.textContent='Фото пока нет.';app.appendChild(empty);}
}
document.getElementById('frameBtn').onclick=function(e){
  e.stopPropagation();var menu=document.getElementById('frameMenu');menu.style.display=menu.style.display==='grid'?'none':'grid';
};
document.querySelectorAll('.frameChoice').forEach(function(btn){
  btn.onclick=function(e){
    e.stopPropagation();selectedFrame=btn.getAttribute('data-frame');localStorage.setItem(frameKey,selectedFrame);document.getElementById('frameMenu').style.display='none';renderHome();
  };
});
document.getElementById('frameRemove').onclick=function(e){
  e.stopPropagation();selectedFrame='';localStorage.removeItem(frameKey);document.getElementById('frameMenu').style.display='none';renderHome();
};
document.addEventListener('click',function(){document.getElementById('frameMenu').style.display='none';document.getElementById('bgMenu').style.display='none';});
document.getElementById('okBtn').onclick=createTab;
document.getElementById('cancelBtn').onclick=closeModal;
nameInput.onkeydown=function(e){if(e.key==='Enter')createTab();};
modal.onclick=function(e){if(e.target===modal)closeModal();};
picker.onchange=function(){
  var files=Array.prototype.slice.call(picker.files);if(!files.length)return;
  var arr=getImages();var slots=8-arr.length;
  if(slots<=0){alert('В одной вкладке можно хранить максимум 8 фото.');picker.value='';return;}
  if(files.length>slots){files=files.slice(0,slots);alert('Можно добавить только '+slots+' фото: максимум — 8 в одной вкладке.');}
  var remaining=files.length;
  files.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(){arr.push(reader.result);remaining--;if(remaining===0){try{localStorage.setItem('imgs_'+current,JSON.stringify(arr));renderTab();}catch(e){alert('Не удалось сохранить фото. Возможно, в памяти браузера закончилось место.');}}};
    reader.readAsDataURL(file);
  });
};
document.getElementById('bgBtn').onclick=function(e){
  e.stopPropagation();var menu=document.getElementById('bgMenu');menu.style.display=menu.style.display==='grid'?'none':'grid';
};
document.getElementById('bgRemove').onclick=function(e){e.stopPropagation();selectedBg='';localStorage.removeItem(bgKey);document.getElementById('bgMenu').style.display='none';applyBackground();};
document.querySelectorAll('.bgChoice').forEach(function(btn){
  btn.onclick=function(e){e.stopPropagation();selectedBg=btn.getAttribute('data-bg');localStorage.setItem(bgKey,selectedBg);document.getElementById('bgMenu').style.display='none';applyBackground();};
});
loadTabs();applyBackground();renderHome();
})();
</script>
</body></html>
